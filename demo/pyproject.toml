[project]
name = "homesense-voice-demo"
version = "0.1.0"
description = "HomeSense smart-home customer-service voice agent (LiveKit Agents demo)"
requires-python = ">=3.11,<3.14"
dependencies = [
    # LiveKit Inference supplies STT/LLM/TTS and the turn detector as
    # "provider/model" strings, so no provider plugins are needed.
    # The [silero] extra is the local VAD loaded in prewarm.
    "livekit-agents[mcp,silero]~=1.6",
    "mcp>=1.2",
    "python-dotenv~=1.0",
]

[dependency-groups]
dev = [
    "pytest~=8.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
